[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rooted"
version = "0.1.0"
description = "Replicate a reference PDF's design with your own .docx content."
readme = "docs/PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.125",        # transform_schema, beta fallbacks, messages.stream
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "playwright>=1.45",        # default renderer; then `playwright install chromium`
    "matplotlib>=3.8",
    "numpy>=1.26",
    "fonttools>=4.50",
    "pillow>=10.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=63"]   # optional renderer; needs Pango (`brew install pango`)
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rooted = "rooted.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rooted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY; run with -m live)",
    "render: needs a working PDF renderer (Playwright Chromium); auto-skipped if unavailable",
    "network: downloads fonts; skipped unless ROOTED_ALLOW_NETWORK=1",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # models.py uses Optional/List deliberately

[tool.ruff.lint.per-file-ignores]
# LLM prompt prose and SVG path data are long single-line strings by nature.
"src/rooted/**/prompts.py" = ["E501"]
"src/rooted/visuals/icons.py" = ["E501"]
"src/rooted/cli.py" = ["B008"]  # typer idiom: Option/Argument calls in defaults

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
